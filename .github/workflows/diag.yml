name: ftp-diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - env:
          H: ${{ secrets.FTP_HOST }}
        run: for p in 22 5202 5221 5255; do if timeout 8 bash -c "echo > /dev/tcp/$H/$p" 2>/dev/null; then echo "port $p open"; else echo "port $p no answer"; fi; done
