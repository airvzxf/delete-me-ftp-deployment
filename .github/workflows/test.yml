name: ftp-deployment-action validation

on:
  workflow_dispatch:
    inputs:
      cell_id:
        description: 'Cell ID (S1, S2, S3, D1, ..., C10, etc.)'
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_IP: "5.78.83.142"
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load cell config
        id: cellcfg
        run: |
          CELL_JSON=$(jq -c --arg c "${{ inputs.cell_id }}" '.[$c] // empty' cell-config.json)
          if [ -z "$CELL_JSON" ] || [ "$CELL_JSON" = "null" ] || [ "$CELL_JSON" = "{}" ]; then
            echo "ERROR: cell ${{ inputs.cell_id }} not in cell-config.json" >&2
            exit 99
          fi
          echo "config=$CELL_JSON" >> $GITHUB_OUTPUT
          echo "Loaded config for ${{ inputs.cell_id }}:"
          echo "$CELL_JSON" | jq .

      - name: Network reachability check
        run: |
          echo "Probing $VPS_IP..."
          for p in 21 990; do
            timeout 5 bash -c "</dev/tcp/$VPS_IP/$p" 2>&1 && echo "port $p OPEN" || echo "port $p closed/filtered"
          done
          echo "--- GH runner IP ---"
          timeout 5 curl -s https://api.ipify.org 2>&1 || echo "no outbound"

      - name: Show cell description
        run: |
          DESC=$(jq -r --arg c "${{ inputs.cell_id }}" '.[$c].description' cell-config.json)
          echo "::group::[${{ inputs.cell_id }}] $DESC"
          echo "$DESC"

      - name: Pre-setup (only for cells that need it)
        if: ${{ fromJson(steps.cellcfg.outputs.config).presetup != null }}
        run: |
          set -eu
          PRESETUP='${{ fromJson(steps.cellcfg.outputs.config).presetup }}'
          echo "Pre-setup: $PRESETUP"
          eval "$PRESETUP"

      - name: Setup fixture
        run: |
          mkdir -p /tmp/fix
          cat > /tmp/fix/index.html <<'EOF'
          <html><body><h1>Hello v2.11.13</h1></body></html>
          EOF
          cat > /tmp/fix/about.html <<'EOF'
          <html><body><h1>About</h1></body></html>
          EOF
          mkdir -p /tmp/fix/assets
          echo "keep me" > /tmp/fix/assets/.keep
          echo "ignored" > /tmp/fix/local.bak
          ls -la /tmp/fix/

      - name: Run ftp-deployment-action
        id: run
        uses: airvzxf/ftp-deployment-action@v2.11.13
        with:
          server: ${{ fromJson(steps.cellcfg.outputs.config).server }}
          user: ${{ fromJson(steps.cellcfg.outputs.config).user || env.FTP_USER }}
          password: ${{ fromJson(steps.cellcfg.outputs.config).password || env.FTP_PASSWORD }}
          local_dir: /tmp/fix
          remote_dir: /
          max_retries: ${{ fromJson(steps.cellcfg.outputs.config).max_retries || '3' }}
          net_timeout: ${{ fromJson(steps.cellcfg.outputs.config).net_timeout || '15s' }}
          dns_fatal_timeout: ${{ fromJson(steps.cellcfg.outputs.config).dns_fatal_timeout || '15s' }}
          ftp_ssl_allow: ${{ fromJson(steps.cellcfg.outputs.config).ftp_ssl_allow || 'false' }}
          ssl_verify_certificate: ${{ fromJson(steps.cellcfg.outputs.config).ssl_verify_certificate || 'true' }}
          ssl_check_hostname: ${{ fromJson(steps.cellcfg.outputs.config).ssl_check_hostname || 'true' }}
          lftp_settings: ${{ fromJson(steps.cellcfg.outputs.config).lftp_settings || '' }}
          exclude: ${{ fromJson(steps.cellcfg.outputs.config).exclude || '' }}
          exclude_delete: ${{ fromJson(steps.cellcfg.outputs.config).exclude_delete || '' }}
          debug: ${{ fromJson(steps.cellcfg.outputs.config).debug || 'false' }}
          dry_run: ${{ fromJson(steps.cellcfg.outputs.config).dry_run || 'false' }}
          delete: ${{ fromJson(steps.cellcfg.outputs.config).delete || 'false' }}
          concurrency_lock: ${{ fromJson(steps.cellcfg.outputs.config).concurrency_lock || 'false' }}
          concurrency_lock_timeout: ${{ fromJson(steps.cellcfg.outputs.config).concurrency_lock_timeout || '300' }}
          concurrency_lock_poll_interval: ${{ fromJson(steps.cellcfg.outputs.config).concurrency_lock_poll_interval || '5' }}
        env:
          DEBUG: 'true'

      - name: Verify state on VPS
        if: always()
        run: |
          echo "--- Files on VPS after action ---"
          echo "(checking via direct SSH)"
        # This won't work without SSH key. Document for now.

      - name: Upload lftp log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cell-${{ inputs.cell_id }}-log
          path: |
            /home/lftp/.lftp-logs/*.log
          if-no-files-found: ignore
