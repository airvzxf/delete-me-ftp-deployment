name: ftp-deployment-action validation

on:
  workflow_dispatch:
    inputs:
      cell_id:
        description: 'Cell ID (S1, S2, S3, D1, ..., C10, etc.)'
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_IP: "5.78.83.142"
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load cell config
        id: cellcfg
        run: |
          CELL_JSON=$(jq -c --arg c "${{ inputs.cell_id }}" '.[$c]' cell-config.json)
          if [ "$CELL_JSON" = "null" ] || [ -z "$CELL_JSON" ]; then
            echo "ERROR: cell ${{ inputs.cell_id }} not in cell-config.json"
            exit 99
          fi
          echo "Loaded config for ${{ inputs.cell_id }}:"
          echo "$CELL_JSON" | jq .

      - name: Show cell description
        run: |
          DESC=$(jq -r --arg c "${{ inputs.cell_id }}" '.[$c].description' cell-config.json)
          echo "::group::[${{ inputs.cell_id }}] $DESC"
          echo "$DESC" > /tmp/cell-desc.txt

      - name: Pre-setup (optional)
        if: |
          jq -e --arg c "${{ inputs.cell_id }}" '.[$c].presetup' cell-config.json > /dev/null
        run: |
          set -eu
          PRESETUP=$(jq -r --arg c "${{ inputs.cell_id }}" '.[$c].presetup' cell-config.json)
          echo "Pre-setup: $PRESETUP"
          eval "$PRESETUP"

      - name: Setup fixture
        run: |
          mkdir -p /tmp/fix
          cat > /tmp/fix/index.html <<'EOF'
          <html><body><h1>Hello v2.11.13</h1></body></html>
          EOF
          cat > /tmp/fix/about.html <<'EOF'
          <html><body><h1>About</h1></body></html>
          EOF
          mkdir -p /tmp/fix/assets
          echo "keep me" > /tmp/fix/assets/.keep
          echo "ignored" > /tmp/fix/local.bak
          ls -la /tmp/fix/

      - name: Run ftp-deployment-action
        id: run
        uses: airvzxf/ftp-deployment-action@v2.11.13
        with:
          server: ${{ fromJson(steps.cellcfg.outputs.value).server || format('ftp://{0}@{1}:21', env.FTP_USER, env.VPS_IP) }}
          user: ${{ fromJson(steps.cellcfg.outputs.value).user || env.FTP_USER }}
          password: ${{ fromJson(steps.cellcfg.outputs.value).password || env.FTP_PASSWORD }}
          local_dir: /tmp/fix
          remote_dir: /
          max_retries: ${{ fromJson(steps.cellcfg.outputs.value).max_retries || '1' }}
          net_timeout: ${{ fromJson(steps.cellcfg.outputs.value).net_timeout || '10s' }}
          dns_fatal_timeout: ${{ fromJson(steps.cellcfg.outputs.value).dns_fatal_timeout || '10s' }}
          ftp_ssl_allow: ${{ fromJson(steps.cellcfg.outputs.value).ftp_ssl_allow || 'false' }}
          ssl_verify_certificate: ${{ fromJson(steps.cellcfg.outputs.value).ssl_verify_certificate || 'true' }}
          ssl_check_hostname: ${{ fromJson(steps.cellcfg.outputs.value).ssl_check_hostname || 'true' }}
          lftp_settings: ${{ fromJson(steps.cellcfg.outputs.value).lftp_settings || '' }}
          exclude: ${{ fromJson(steps.cellcfg.outputs.value).exclude || '' }}
          exclude_delete: ${{ fromJson(steps.cellcfg.outputs.value).exclude_delete || '' }}
          debug: ${{ fromJson(steps.cellcfg.outputs.value).debug || 'false' }}
          dry_run: ${{ fromJson(steps.cellcfg.outputs.value).dry_run || 'false' }}
          delete: ${{ fromJson(steps.cellcfg.outputs.value).delete || 'false' }}
          concurrency_lock: ${{ fromJson(steps.cellcfg.outputs.value).concurrency_lock || 'false' }}
          concurrency_lock_timeout: ${{ fromJson(steps.cellcfg.outputs.value).concurrency_lock_timeout || '300' }}
          concurrency_lock_poll_interval: ${{ fromJson(steps.cellcfg.outputs.value).concurrency_lock_poll_interval || '5' }}
        env:
          DEBUG: 'true'

      - name: Verify banner / rc
        if: always()
        run: |
          EXPECTED_BANNER=$(jq -r --arg c "${{ inputs.cell_id }}" '.[$c].expected_banner' cell-config.json)
          EXPECTED_RC=$(jq -r --arg c "${{ inputs.cell_id }}" '.[$c].expected_rc' cell-config.json)
          echo "Expected banner: $EXPECTED_BANNER"
          echo "Expected RC: $EXPECTED_RC"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cell-${{ inputs.cell_id }}-log
          path: |
            ~/.lftp-logs/*.log
            /home/runner/.lftp-logs/*.log
          if-no-files-found: ignore
