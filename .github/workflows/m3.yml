name: ftp-smoke-m3
on: workflow_dispatch
jobs:
  ref-v2120:
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p site/assets && echo "m3 v2.12.0 $(date -u)" > site/index.html && echo about > site/about.html && echo x > site/old.bak && touch site/assets/.keep
      - name: Dry run
        uses: airvzxf/ftp-deployment-action@v2.12.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          user: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local_dir: site
          remote_dir: m3-v2.12.0
          dry_run: 'true'
      - name: Upload
        uses: airvzxf/ftp-deployment-action@v2.12.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          user: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local_dir: site
          remote_dir: m3-v2.12.0
          exclude: '*.bak'
      - name: Wrong password (must fail)
        id: bad
        continue-on-error: true
        uses: airvzxf/ftp-deployment-action@v2.12.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          user: ${{ secrets.FTP_USERNAME }}
          password: wrong-password
          local_dir: site
          remote_dir: m3-v2.12.0
      - run: test "${{ steps.bad.outcome }}" = failure
  ref-v2:
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p site/assets && echo "m3 v2 $(date -u)" > site/index.html && echo about > site/about.html && echo x > site/old.bak && touch site/assets/.keep
      - name: Dry run
        uses: airvzxf/ftp-deployment-action@v2
        with:
          server: ${{ secrets.FTP_SERVER }}
          user: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local_dir: site
          remote_dir: m3-v2
          dry_run: 'true'
      - name: Upload
        uses: airvzxf/ftp-deployment-action@v2
        with:
          server: ${{ secrets.FTP_SERVER }}
          user: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local_dir: site
          remote_dir: m3-v2
          exclude: '*.bak'
      - name: Wrong password (must fail)
        id: bad
        continue-on-error: true
        uses: airvzxf/ftp-deployment-action@v2
        with:
          server: ${{ secrets.FTP_SERVER }}
          user: ${{ secrets.FTP_USERNAME }}
          password: wrong-password
          local_dir: site
          remote_dir: m3-v2
      - run: test "${{ steps.bad.outcome }}" = failure
  ref-latest:
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p site/assets && echo "m3 latest $(date -u)" > site/index.html && echo about > site/about.html && echo x > site/old.bak && touch site/assets/.keep
      - name: Dry run
        uses: airvzxf/ftp-deployment-action@latest
        with:
          server: ${{ secrets.FTP_SERVER }}
          user: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local_dir: site
          remote_dir: m3-latest
          dry_run: 'true'
      - name: Upload
        uses: airvzxf/ftp-deployment-action@latest
        with:
          server: ${{ secrets.FTP_SERVER }}
          user: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local_dir: site
          remote_dir: m3-latest
          exclude: '*.bak'
      - name: Wrong password (must fail)
        id: bad
        continue-on-error: true
        uses: airvzxf/ftp-deployment-action@latest
        with:
          server: ${{ secrets.FTP_SERVER }}
          user: ${{ secrets.FTP_USERNAME }}
          password: wrong-password
          local_dir: site
          remote_dir: m3-latest
      - run: test "${{ steps.bad.outcome }}" = failure
