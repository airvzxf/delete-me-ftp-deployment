name: ftp-smoke-m2
on: workflow_dispatch
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p site/assets && echo "smoke $(date -u)" > site/index.html && echo about > site/about.html && echo x > site/old.bak && touch site/assets/.keep
      - name: Dry run
        uses: airvzxf/ftp-deployment-action@798c09892bca622e650c596fef67666d7721997f
        with:
          server: ${{ secrets.FTP_SERVER }}
          user: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local_dir: site
          remote_dir: m2-smoke
          dry_run: 'true'
      - name: Upload
        uses: airvzxf/ftp-deployment-action@798c09892bca622e650c596fef67666d7721997f
        with:
          server: ${{ secrets.FTP_SERVER }}
          user: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local_dir: site
          remote_dir: m2-smoke
          exclude: '*.bak'
  wrong-password:
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p site && echo smoke > site/index.html
      - name: Upload with a wrong password (must fail)
        id: bad
        continue-on-error: true
        uses: airvzxf/ftp-deployment-action@798c09892bca622e650c596fef67666d7721997f
        with:
          server: ${{ secrets.FTP_SERVER }}
          user: ${{ secrets.FTP_USERNAME }}
          password: wrong-password
          local_dir: site
          remote_dir: m2-smoke
      - name: Expect failure
        run: test "${{ steps.bad.outcome }}" = failure
